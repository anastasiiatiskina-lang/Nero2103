<style>
:root{
  --bg:#F7F3EE;
  --ink:#1A1614;
  --dim:#7D7369;
  --wine:#6E1D2B;
  --line:rgba(26,22,20,0.12);
  --serif:'Fraunces','Georgia',serif;
  --sans:'Onest','-apple-system',BlinkMacSystemFont,'Segoe UI',sans-serif;
  --script:'Sacramento',cursive;
  --dur:0.42s;
  --ease:cubic-bezier(.22,.61,.36,1);
}
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;padding:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-weight:400;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;min-height:100vh}
a{color:inherit;text-decoration:none}
img{display:block;max-width:100%;height:auto}
h1,h2{text-wrap:balance;-webkit-hyphens:none;hyphens:none}

/* Layout */
.page{min-height:100vh;display:grid;grid-template-columns:1fr 1fr;position:relative}

/* Header */
.hd{position:absolute;top:0;left:0;right:0;z-index:10;display:flex;justify-content:space-between;align-items:center;padding:32px 44px}
.logo{display:flex;flex-direction:column;align-items:flex-start;gap:2px}
.logo img{width:150px;height:auto}
.logo .script{font-family:var(--script);font-size:20px;color:var(--dim);line-height:1;transform:translateY(-4px)}
.back-link{font-family:var(--sans);font-size:11px;font-weight:500;letter-spacing:.28em;text-transform:uppercase;color:var(--ink);border-bottom:1px solid var(--ink);padding-bottom:4px}

/* Photo side */
.photo{position:relative;overflow:hidden;background:#000}
.photo img{width:100%;height:100%;object-fit:cover;object-position:60% 20%}

/* Copy side */
.copy{padding:120px 80px 80px;display:flex;flex-direction:column;justify-content:center;position:relative}
.eyebrow{font-family:var(--sans);font-size:11px;font-weight:500;letter-spacing:.4em;text-transform:uppercase;color:var(--dim);margin-bottom:28px}
.num{font-family:var(--serif);font-variation-settings:"opsz" 144,"SOFT" 30;font-weight:300;font-size:clamp(140px,18vw,240px);line-height:.85;letter-spacing:-.03em;color:var(--wine);margin:0 0 8px}
.num em{font-style:italic}
h1{font-family:var(--serif);font-variation-settings:"opsz" 144,"SOFT" 40;font-weight:400;font-style:italic;font-size:clamp(30px,4.2vw,54px);line-height:1.05;letter-spacing:-.01em;color:var(--ink);margin:0 0 24px}
.lead{font-family:var(--serif);font-variation-settings:"opsz" 24;font-weight:300;font-size:clamp(17px,1.5vw,20px);line-height:1.55;color:var(--ink);margin:0 0 20px;max-width:500px}
.tiny{font-family:var(--sans);font-size:12px;color:var(--dim);letter-spacing:.02em;margin:0 0 40px;max-width:440px;font-style:italic}

.cta-row{display:flex;gap:14px;flex-wrap:wrap;margin-top:12px}
.btn{display:inline-block;padding:14px 26px;font-family:var(--sans);font-size:11px;font-weight:500;letter-spacing:.28em;text-transform:uppercase;color:#FFFFFF;background:var(--ink);border:1px solid var(--ink);cursor:pointer;transition:all var(--dur) var(--ease)}
.btn:hover{background:transparent;color:var(--ink)}
.btn-ghost{color:var(--ink);background:transparent}
.btn-ghost:hover{background:var(--ink);color:#FFFFFF}

.foot-mini{position:absolute;bottom:36px;left:80px;right:80px;font-family:var(--sans);font-size:10px;letter-spacing:.28em;text-transform:uppercase;color:var(--dim);display:flex;justify-content:space-between;align-items:center;gap:24px}
.foot-mini .sep{opacity:.5;margin:0 8px}

@media(max-width:900px){
  .page{grid-template-columns:1fr;grid-template-rows:46vh auto}
  .hd{padding:22px 24px}
  .logo img{width:120px}
  .logo .script{font-size:16px}
  .copy{padding:60px 24px 100px}
  .num{font-size:clamp(110px,32vw,180px)}
  .foot-mini{position:static;margin-top:36px;flex-wrap:wrap}
}
</style>
